<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080d">
<title>Daily Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #07080d;
    --panel: rgba(255,255,255,.035);
    --panel-solid: #0f1119;
    --border: rgba(255,255,255,.08);
    --border-strong: rgba(255,255,255,.14);
    --text: #f4f5f8;
    --text-2: #a9adbd;
    --text-3: #6d7184;
    --blue: #4f8cff;
    --violet: #8b5cf6;
    --cyan: #22d3ee;
    --green: #34d399;
    --gold: #fbbf24;
    --silver: #cbd5e1;
    --bronze: #f59e6b;
    --track: rgba(255,255,255,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(79,140,255,.16), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(139,92,246,.14), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-feature-settings: "tnum" 1, "cv11" 1, "ss01" 1;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 16px 40px; }

  /* ---------- Header ---------- */
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--blue), var(--violet));
    box-shadow: 0 6px 24px rgba(99,102,241,.45), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .brand h1 { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -.02em; }
  .brand p { margin: 1px 0 0; font-size: 12px; color: var(--text-3); font-weight: 500; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .ctl {
    display: inline-flex; align-items: center; height: 38px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--border); backdrop-filter: blur(12px);
  }
  .ctl button, .icon-btn {
    all: unset; cursor: pointer; display: grid; place-items: center; color: var(--text-2);
    width: 36px; height: 36px; border-radius: 11px; transition: color .15s, background .15s;
  }
  .ctl button:hover:not(:disabled), .icon-btn:hover { color: var(--text); background: rgba(255,255,255,.06); }
  .ctl button:disabled { opacity: .25; cursor: default; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .datenav label { position: relative; padding: 0 4px; font-size: 14px; font-weight: 600; min-width: 120px; text-align: center; cursor: pointer; }
  .datenav input[type=date] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; color-scheme: dark; }
  .datenav input[type=date]::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
  .today-btn { all: unset; cursor: pointer; height: 38px; padding: 0 14px; border-radius: 12px; font-size: 13px; font-weight: 600;
    color: var(--text); background: linear-gradient(135deg, rgba(79,140,255,.25), rgba(139,92,246,.25)); border: 1px solid rgba(139,92,246,.4); }
  .today-btn[hidden] { display: none; }
  .seg { padding: 3px; gap: 2px; }
  .seg button { width: auto; padding: 0 13px; height: 30px; border-radius: 9px; font-size: 13px; font-weight: 600; }
  .seg button[aria-pressed="true"] { color: var(--text); background: rgba(255,255,255,.1); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
  .icon-btn { width: 38px; height: 38px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); }

  /* ---------- Hero ---------- */
  .top { display: grid; grid-template-columns: 1.65fr 1fr; gap: 16px; margin-bottom: 16px; }
  .hero {
    position: relative; overflow: hidden; border-radius: 24px; padding: 30px 32px 28px;
    display: flex; flex-direction: column;
    background:
      radial-gradient(600px 300px at 0% 0%, rgba(79,140,255,.55), transparent 60%),
      radial-gradient(500px 320px at 100% 100%, rgba(139,92,246,.6), transparent 60%),
      linear-gradient(135deg, #16204a, #241449);
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 30px 80px -30px rgba(79,70,229,.6), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .hero::after { /* subtle grid sheen */
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .18;
    background-image: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
    background-size: 36px 36px;
    mask-image: radial-gradient(ellipse at 70% 30%, #000 0%, transparent 70%);
  }
  .hero > * { position: relative; z-index: 1; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.75); margin: 0 0 10px; }
  .live-pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px;
    background: rgba(52,211,153,.14); color: #a7f3d0; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .live-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(52,211,153,.6); animation: ping 2s infinite; }
  .live-pill.off { background: rgba(255,255,255,.08); color: rgba(255,255,255,.6); }
  .live-pill.off .dot { background: rgba(255,255,255,.5); animation: none; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.6); } 80%, 100% { box-shadow: 0 0 0 7px rgba(52,211,153,0); } }
  .hero-value {
    margin: 0; font-weight: 800; letter-spacing: -.045em; line-height: 1;
    font-size: clamp(52px, 10vw, 104px);
    color: #fff;
  }
  .hero-value .whole, .hero-value .cents { -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero-value .whole { background-image: linear-gradient(180deg, #fff 30%, #c7d2fe 100%); }
  .hero-value .cents { font-weight: 700; background-image: linear-gradient(180deg, rgba(224,231,255,.55), rgba(165,180,252,.4)); }
  .hero-value.error { font-size: 18px; font-weight: 500; letter-spacing: 0; color: #fecaca; line-height: 1.5; }
  .hero-foot { display: flex; flex-wrap: wrap; gap: 10px 32px; margin-top: auto; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.12); }
  .hero-value { margin-bottom: 26px !important; }
  .hero-foot div { display: flex; flex-direction: column; gap: 3px; }
  .hero-foot dt { font-size: 12px; color: rgba(255,255,255,.6); font-weight: 500; }
  .hero-foot dd { margin: 0; font-size: 17px; font-weight: 700; }

  .bump { animation: bump .9s cubic-bezier(.2,.8,.2,1); }
  @keyframes bump { 0% { transform: scale(1); } 25% { transform: scale(1.04); filter: brightness(1.35); } 100% { transform: scale(1); } }

  .side { display: grid; grid-template-rows: 1fr 1fr; gap: 16px; }
  .tile {
    border-radius: 24px; padding: 22px 24px; background: var(--panel); border: 1px solid var(--border);
    backdrop-filter: blur(14px); display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-height: 140px;
  }
  .tile-label { font-size: 13px; color: var(--text-2); font-weight: 600; display: flex; align-items: center; gap: 8px; margin: 0; }
  .tile-label .ico { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; }
  .tile-value { font-size: clamp(40px, 6vw, 60px); font-weight: 800; letter-spacing: -.04em; line-height: 1; margin: 0; }
  .tile-sub { font-size: 13px; color: var(--text-3); margin: 0; }
  .top-agent { display: flex; align-items: center; gap: 14px; }
  .top-agent .tile-value { font-size: clamp(28px, 4vw, 38px); letter-spacing: -.03em; }

  /* ---------- Leaderboard ---------- */
  .board { border-radius: 24px; padding: 24px 28px 18px; background: var(--panel); border: 1px solid var(--border); backdrop-filter: blur(14px); }
  .board-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
  .board-head h2 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .board-head span { font-size: 12px; color: var(--text-3); }

  .bars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .row {
    display: grid; grid-template-columns: 28px minmax(120px, 190px) 1fr; align-items: center; gap: 14px;
    padding: 10px 10px; border-radius: 16px; transition: background .2s;
  }
  .row:hover, .row:focus-visible { background: rgba(255,255,255,.035); }
  .row.celebrate { animation: glow 2.4s ease-out; }
  @keyframes glow { 0% { background: rgba(52,211,153,.22); box-shadow: inset 0 0 0 1px rgba(52,211,153,.5); } 100% { background: transparent; box-shadow: inset 0 0 0 1px transparent; } }
  .rank { font-size: 13px; font-weight: 700; color: var(--text-3); text-align: center; }
  .medal { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #1a1205; }
  .medal.m1 { background: linear-gradient(135deg, #fde68a, var(--gold)); box-shadow: 0 0 18px rgba(251,191,36,.45); }
  .medal.m2 { background: linear-gradient(135deg, #f1f5f9, var(--silver)); }
  .medal.m3 { background: linear-gradient(135deg, #fed7aa, var(--bronze)); }
  .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .avatar {
    flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
    font-size: 13px; font-weight: 700; color: #fff; letter-spacing: .02em;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 4px 14px rgba(0,0,0,.35);
  }
  .avatar.lg { width: 52px; height: 52px; font-size: 18px; }
  .who-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who-sub { font-size: 12px; color: var(--text-3); margin-top: 1px; }
  .track { position: relative; height: 40px; border-radius: 12px; background: var(--track); overflow: hidden; }
  .fill {
    position: absolute; inset: 0 auto 0 0; border-radius: 12px; min-width: 0;
    background: linear-gradient(90deg, var(--blue), var(--violet));
    box-shadow: 0 0 24px rgba(99,102,241,.35), inset 0 1px 0 rgba(255,255,255,.25);
    transition: width .9s cubic-bezier(.2,.8,.2,1);
  }
  .row.first .fill { background: linear-gradient(90deg, #6366f1, #a855f7 60%, #ec4899); box-shadow: 0 0 30px rgba(168,85,247,.5), inset 0 1px 0 rgba(255,255,255,.3); }
  .fill::after { /* moving sheen */
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.22) 45%, transparent 70%);
    background-size: 220% 100%; animation: sheen 3.6s ease-in-out infinite;
  }
  @keyframes sheen { 0% { background-position: 160% 0; } 60%, 100% { background-position: -60% 0; } }
  .val {
    position: absolute; top: 0; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    font-size: 15px; font-weight: 700; white-space: nowrap; transition: left .9s cubic-bezier(.2,.8,.2,1);
  }
  .val.inside { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px;
    font-size: 11.5px; font-weight: 700; background: rgba(255,255,255,.1); color: var(--text-2); }
  .val.inside .pill { background: rgba(255,255,255,.2); color: #fff; }
  .row.zero .who-name { color: var(--text-2); }
  .row.zero .val { color: var(--text-3); font-weight: 600; }

  .empty { padding: 44px 0 34px; text-align: center; color: var(--text-3); font-size: 14px; }
  .empty strong { display: block; color: var(--text); font-size: 17px; font-weight: 700; margin-bottom: 6px; }

  footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 16px; font-size: 12px; color: var(--text-3); }

  /* ---------- Tooltip / Toast / Confetti ---------- */
  .tooltip {
    position: fixed; pointer-events: none; z-index: 20; opacity: 0; transition: opacity .12s;
    background: rgba(15,17,25,.95); border: 1px solid var(--border-strong); border-radius: 14px; padding: 12px 14px;
    font-size: 13px; min-width: 190px; box-shadow: 0 20px 50px rgba(0,0,0,.5); backdrop-filter: blur(10px);
  }
  .tooltip.show { opacity: 1; }
  .tooltip h3 { margin: 0 0 8px; font-size: 14px; font-weight: 700; }
  .tooltip div { display: flex; justify-content: space-between; gap: 18px; color: var(--text-2); line-height: 1.7; }
  .tooltip b { color: var(--text); }

  .toasts { position: fixed; top: 92px; right: 20px; z-index: 30; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .toast {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 12px; border-radius: 16px; min-width: 260px;
    background: linear-gradient(135deg, rgba(16,185,129,.22), rgba(79,140,255,.18)), rgba(15,17,25,.92);
    border: 1px solid rgba(52,211,153,.45); box-shadow: 0 20px 50px rgba(0,0,0,.5), 0 0 40px rgba(52,211,153,.2);
    backdrop-filter: blur(10px); animation: toastIn .5s cubic-bezier(.2,.9,.3,1.3), toastOut .5s ease-in 5.5s forwards;
  }
  .toast b { display: block; font-size: 14px; }
  .toast span { font-size: 12.5px; color: #a7f3d0; font-weight: 600; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(.96); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-10px); } }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 25; }

  /* ---------- TV mode ---------- */
  body.tv .wrap { max-width: none; padding: 3vh 3vw; min-height: 100vh; display: flex; flex-direction: column; }
  body.tv .board { flex: 1; display: flex; flex-direction: column; }
  body.tv .bars { flex: 1; justify-content: space-evenly; }
  body.tv .tile-value { font-size: clamp(56px, 5vw, 90px); }
  body.tv .top-agent .tile-value { font-size: clamp(36px, 3.2vw, 56px); }
  body.tv .avatar { width: 48px; height: 48px; font-size: 16px; }
  body.tv .medal { width: 32px; height: 32px; font-size: 14px; }
  body.tv .board-head h2 { font-size: 20px; }
  body.tv .hero-value { font-size: clamp(80px, 11vw, 170px); }
  body.tv .row { padding: 1.1vh 10px; }
  body.tv .track { height: 64px; border-radius: 16px; }
  body.tv .fill { border-radius: 16px; }
  body.tv .who-name { font-size: 20px; }
  body.tv .val { font-size: 22px; }

  @media (max-width: 860px) {
    .top { grid-template-columns: 1fr; }
    .side { grid-template-columns: 1fr 1fr; grid-template-rows: none; }
  }
  @media (max-width: 560px) {
    .wrap { padding-top: 18px; }
    .controls { width: 100%; }
    .datenav { flex: 1; justify-content: space-between; }
    .hero { padding: 24px 20px; border-radius: 20px; }
    .side { grid-template-columns: 1fr 1fr; gap: 12px; }
    .tile { padding: 16px; min-height: 118px; border-radius: 20px; }
    .tile-value { font-size: 36px; }
    #topAvatar { display: none; }
    .top-agent .tile-value { font-size: 24px; }
    .board { padding: 18px 12px 12px; border-radius: 20px; }
    .board-head { padding: 0 6px; }
    .row { grid-template-columns: 22px 96px 1fr; gap: 8px; padding: 8px 4px; }
    .avatar { width: 30px; height: 30px; font-size: 11px; }
    .who { gap: 8px; }
    .who-name { font-size: 14px; }
    .who-sub { display: none; }
    .track { height: 34px; }
    .val { font-size: 13px; padding: 0 8px; }
    .val .pill { display: none; }
    .toasts { left: 16px; right: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><rect x="2" y="8" width="3" height="6" rx="1.2" fill="#fff"/><rect x="6.5" y="4.5" width="3" height="9.5" rx="1.2" fill="#fff"/><rect x="11" y="2" width="3" height="12" rx="1.2" fill="#fff"/></svg>
      </div>
      <div>
        <h1>Daily Sales</h1>
        <p id="clock">&nbsp;</p>
      </div>
    </div>
    <div class="controls">
      <div class="ctl datenav" role="group" aria-label="Date">
        <button id="prev" aria-label="Previous day"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <label><span id="dateLabel">—</span><input type="date" id="datePicker" aria-label="Pick a date"></label>
        <button id="next" aria-label="Next day"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <button class="today-btn" id="todayBtn" hidden>Today</button>
      <div class="ctl seg" role="group" aria-label="Rank by">
        <button data-metric="revenue" aria-pressed="true">Revenue</button>
        <button data-metric="premium" aria-pressed="false">Premium</button>
        <button data-metric="apps" aria-pressed="false">Policies</button>
      </div>
      <button class="icon-btn" id="tvBtn" aria-label="Full screen TV mode" title="TV mode (F)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="top">
    <section class="hero" aria-live="polite">
      <p class="eyebrow"><span class="live-pill" id="livePill"><span class="dot"></span><span id="liveWord">Live</span></span><span id="heroLabel">Total produced today</span></p>
      <p class="hero-value" id="heroValue"><span class="whole">$0</span><span class="cents">.00</span></p>
      <dl class="hero-foot">
        <div><dt>Monthly premium</dt><dd id="statPremium">—</dd></div>
        <div><dt>Avg per policy</dt><dd id="statAvg">—</dd></div>
        <div><dt>Agents producing</dt><dd id="statAgents">—</dd></div>
      </dl>
    </section>

    <div class="side">
      <section class="tile">
        <p class="tile-label"><span class="ico" style="background:rgba(34,211,238,.15)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 2h6l3 3v9H4z" stroke="#67e8f9" stroke-width="1.6" stroke-linejoin="round"/><path d="M6.5 9.5l1.5 1.5 3-3.5" stroke="#67e8f9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Policies written</p>
        <p class="tile-value" id="heroPolicies">0</p>
        <p class="tile-sub" id="policiesSub">&nbsp;</p>
      </section>
      <section class="tile">
        <p class="tile-label"><span class="ico" style="background:rgba(251,191,36,.15)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 5l3 3 3-5 3 5 3-3-1.5 8h-9z" stroke="#fcd34d" stroke-width="1.5" stroke-linejoin="round"/></svg></span>Top producer</p>
        <div class="top-agent"><span id="topAvatar"></span><p class="tile-value" id="statTop">—</p></div>
        <p class="tile-sub" id="topSub">&nbsp;</p>
      </section>
    </div>
  </div>

  <section class="board">
    <div class="board-head">
      <h2 id="chartTitle">Leaderboard · Projected revenue</h2>
      <span id="chartSub"></span>
    </div>
    <ol class="bars" id="bars"></ol>
  </section>

  <footer>
    <span id="liveText">Connecting…</span>
    <span>Source: Master Production Sheet · by App Date</span>
  </footer>
</div>

<div class="tooltip" id="tip" role="tooltip"></div>

<script>
(() => {
  const FALLBACK_REFRESH_MS = 60_000; // safety net; live updates arrive via /api/events
  const METRICS = {
    revenue: { title: 'Leaderboard · Projected revenue', fmt: v => money(v) },
    premium: { title: 'Leaderboard · Monthly premium', fmt: v => money(v, true) },
    apps:    { title: 'Leaderboard · Policies written', fmt: v => plural(v) },
  };
  // Avatar colors follow the agent (by name), never their rank.
  const AVATAR_GRADIENTS = [
    ['#3b82f6', '#6366f1'], ['#f97316', '#ef4444'], ['#10b981', '#14b8a6'], ['#eab308', '#f97316'],
    ['#ec4899', '#a855f7'], ['#22c55e', '#84cc16'], ['#8b5cf6', '#6366f1'], ['#06b6d4', '#3b82f6'],
  ];

  const qs = new URLSearchParams(location.search);
  const state = {
    date: qs.get('date') || null,
    today: null,
    metric: METRICS[qs.get('metric')] ? qs.get('metric') : 'revenue',
    data: null,
  };
  let timer = null;
  let streamOpen = false;

  const $ = id => document.getElementById(id);
  const fmtMoney0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  const fmtMoney2 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 });
  function plural(n) { return `${n} ${n === 1 ? 'policy' : 'policies'}`; }
  function money(v, cents) { return (cents ? fmtMoney2 : fmtMoney0).format(v || 0); }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }

  function parseIso(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
  function toIso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
  function shift(iso, n) { const d = parseIso(iso); d.setDate(d.getDate() + n); return toIso(d); }
  function prettyDate(iso) { return parseIso(iso).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }
  function relLabel(iso, noun) {
    if (iso === state.today) return `${noun} today`;
    if (iso === shift(state.today, -1)) return `${noun} yesterday`;
    return `${noun} · ${parseIso(iso).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}`;
  }

  function initials(name) {
    const parts = name.trim().split(/\s+/);
    return ((parts[0] || '')[0] + (parts.length > 1 ? parts[parts.length - 1][0] : (parts[0] || '')[1] || '')).toUpperCase();
  }
  function avatar(name, cls = '') {
    let h = 0; for (const c of name.toLowerCase()) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    const [a, b] = AVATAR_GRADIENTS[h % AVATAR_GRADIENTS.length];
    return `<span class="avatar ${cls}" style="background:linear-gradient(135deg,${a},${b})" aria-hidden="true">${esc(initials(name))}</span>`;
  }

  // ---------- Count-up ----------
  const shown = { money: 0, policies: 0 };
  function countTo(key, target, draw, ms = 1100) {
    const from = shown[key];
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || from === target) { shown[key] = target; draw(target); return; }
    const t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / ms);
      const e = 1 - Math.pow(1 - p, 3);
      const v = from + (target - from) * e;
      draw(v);
      if (p < 1) requestAnimationFrame(step); else { shown[key] = target; draw(target); }
    };
    requestAnimationFrame(step);
  }
  function drawMoney(v) {
    const [whole, cents] = fmtMoney2.format(v).split('.');
    $('heroValue').innerHTML = '<span class="whole">' + esc(whole) + '</span><span class="cents">.' + esc(cents) + '</span>';
  }

  // ---------- Data ----------
  async function load({ quiet, live } = {}) {
    const url = '/api/production' + (state.date ? '?date=' + state.date : '');
    try {
      const res = await fetch(url, { cache: 'no-store' });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || res.statusText);
      const prev = state.data;
      state.data = body; state.today = body.today; state.date = body.date;
      $('heroValue').classList.remove('error');
      render();
      if (prev && prev.date === body.date) celebrateChanges(prev, body, live);
    } catch (err) {
      if (!quiet || !state.data) {
        $('heroValue').classList.add('error');
        $('heroValue').textContent = err.message;
      }
      $('liveText').textContent = 'Connection issue — retrying';
    }
    schedule();
  }
  function schedule() { clearTimeout(timer); timer = setTimeout(() => load({ quiet: true, live: true }), FALLBACK_REFRESH_MS); }

  function connectStream() {
    if (!window.EventSource) return;
    const es = new EventSource('/api/events');
    es.addEventListener('hello', () => {
      const reconnect = streamOpen === null;
      streamOpen = true; updateLive();
      if (reconnect) load({ quiet: true, live: true });
    });
    es.addEventListener('update', () => load({ quiet: true, live: true }));
    es.onerror = () => { streamOpen = null; updateLive(); };
  }

  function updateLive() {
    const d = state.data;
    const pill = $('livePill');
    if (!d) return;
    const t = new Date(d.updatedAt).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    const isToday = d.date === d.today;
    const on = streamOpen === true && isToday;
    pill.classList.toggle('off', !on);
    $('liveWord').textContent = streamOpen === null ? 'Reconnecting' : isToday ? 'Live' : 'History';
    $('liveText').textContent = streamOpen === null ? 'Reconnecting…' : `Synced with sheet at ${t}`;
  }

  // ---------- Render ----------
  function renderHero(d) {
    const moneyKey = state.metric === 'premium' ? 'premium' : 'revenue';
    $('heroLabel').textContent = relLabel(d.date, moneyKey === 'premium' ? 'Premium written' : 'Total produced');
    countTo('money', d.total[moneyKey], drawMoney);
    countTo('policies', d.total.apps, v => { $('heroPolicies').textContent = Math.round(v); }, 800);

    const producing = d.agents.filter(a => a.apps > 0);
    $('statPremium').textContent = money(d.total.premium, true);
    $('statAvg').textContent = d.total.apps ? money(d.total.revenue / d.total.apps) : '—';
    $('statAgents').textContent = `${producing.length} of ${d.agents.length}`;
    $('policiesSub').textContent = producing.length
      ? `across ${producing.length} agent${producing.length === 1 ? '' : 's'}`
      : (d.date === d.today ? 'First one of the day is up for grabs' : 'None logged');

    const top = [...producing].sort((a, b) => b.revenue - a.revenue || b.apps - a.apps)[0];
    $('statTop').textContent = top ? top.agent : '—';
    $('topAvatar').innerHTML = top ? avatar(top.agent, 'lg') : '';
    $('topSub').textContent = top ? `${money(top.revenue)} · ${plural(top.apps)}` : 'Waiting on the first sale';
  }

  function renderBars(d) {
    const m = state.metric;
    $('chartTitle').textContent = METRICS[m].title;
    const agents = [...d.agents].sort((a, b) => (b[m] - a[m]) || (b.revenue - a.revenue) || a.agent.localeCompare(b.agent));
    const max = Math.max(0, ...agents.map(a => a[m]));
    const list = $('bars');
    const prevW = {};
    list.querySelectorAll('.row').forEach(r => { prevW[r.dataset.agent] = r.querySelector('.fill').dataset.w; });

    if (!agents.length) {
      list.innerHTML = `<li class="empty"><strong>No production logged</strong>Nothing on the sheet for ${esc(prettyDate(d.date))}.</li>`;
      $('chartSub').textContent = '';
      return;
    }
    $('chartSub').textContent = d.total.apps ? `${agents.length} agents` : 'No policies logged yet';

    list.innerHTML = agents.map((a, i) => {
      const v = a[m];
      const zero = v <= 0;
      const pct = max > 0 ? Math.max((v / max) * 100, zero ? 0 : 3) : 0;
      const rank = zero ? `<span class="rank">–</span>` : i < 3 ? `<span class="medal m${i + 1}">${i + 1}</span>` : `<span class="rank">${i + 1}</span>`;
      const pill = m === 'apps' ? '' : `<span class="pill">${esc(plural(a.apps))}</span>`;
      return `<li class="row${zero ? ' zero' : ''}${i === 0 && !zero ? ' first' : ''}" data-i="${i}" data-agent="${esc(a.agent)}" tabindex="0"
                aria-label="Rank ${i + 1}: ${esc(a.agent)}, ${esc(METRICS[m].fmt(v))}, ${esc(plural(a.apps))}">
          ${rank}
          <span class="who">${avatar(a.agent)}<span style="min-width:0"><div class="who-name">${esc(a.agent)}</div><div class="who-sub">${esc(money(a.premium, true))} premium</div></span></span>
          <span class="track">
            <span class="fill" style="width:${prevW[a.agent] || 0}%" data-w="${pct}"></span>
            <span class="val">${esc(METRICS[m].fmt(v))}${pill}</span>
          </span>
        </li>`;
    }).join('');
    list._agents = agents;
    requestAnimationFrame(() => list.querySelectorAll('.row').forEach(placeRow));
  }

  // Put the value inside the bar when it fits, otherwise just past its end.
  function placeRow(row) {
    const fill = row.querySelector('.fill'), val = row.querySelector('.val'), track = row.querySelector('.track');
    const w = Number(fill.dataset.w);
    fill.style.width = w + '%';
    const trackW = track.clientWidth, fillPx = trackW * w / 100, valW = val.scrollWidth;
    const inside = fillPx >= valW + 8;
    val.classList.toggle('inside', inside);
    val.style.left = inside ? `${Math.max(0, fillPx - valW)}px` : `${Math.min(fillPx, trackW - valW)}px`;
  }
  addEventListener('resize', () => document.querySelectorAll('#bars .row').forEach(placeRow));

  function render() {
    const d = state.data;
    $('dateLabel').textContent = prettyDate(d.date);
    $('datePicker').value = d.date;
    $('datePicker').max = d.today;
    $('next').disabled = d.date >= d.today;
    $('todayBtn').hidden = d.date === d.today;
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.metric === state.metric)));
    updateLive();
    renderHero(d);
    renderBars(d);
  }

  // ---------- Celebrations ----------
  function celebrateChanges(prev, next, live) {
    const before = Object.fromEntries(prev.agents.map(a => [a.agent, a]));
    const winners = next.agents
      .map(a => ({ a, was: before[a.agent] || { apps: 0, revenue: 0 } }))
      .filter(({ a, was }) => a.apps > was.apps);
    if (next.total.revenue !== prev.total.revenue) bump('heroValue');
    if (next.total.apps !== prev.total.apps) bump('heroPolicies');
    if (!live || !winners.length) return;
    winners.forEach(({ a, was }, k) => {
      const n = a.apps - was.apps;
      const gain = a.revenue - was.revenue;
      setTimeout(() => toast(a.agent, `${n === 1 ? 'just wrote a policy' : `just wrote ${n} policies`}`, gain > 0 ? `+${money(gain)}` : ''), k * 400);
      const row = document.querySelector(`.row[data-agent="${CSS.escape(a.agent)}"]`);
      if (row) { row.classList.remove('celebrate'); void row.offsetWidth; row.classList.add('celebrate'); }
    });
    confetti();
  }
  function bump(id) { const el = $(id); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  function toast(name, what, amount) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `${avatar(name)}<div><b>${esc(name)} ${esc(what)} 🎉</b><span>${esc(amount)}</span></div>`;
    $('toasts').appendChild(el);
    setTimeout(() => el.remove(), 6200);
  }
  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = $('confetti'), ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const colors = ['#4f8cff', '#8b5cf6', '#ec4899', '#fbbf24', '#34d399', '#22d3ee'];
    const parts = Array.from({ length: 160 }, () => ({
      x: innerWidth * (0.3 + Math.random() * 0.4), y: innerHeight * 0.35,
      vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 15 - 5,
      s: 5 + Math.random() * 6, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.35,
      c: colors[(Math.random() * colors.length) | 0], life: 0,
    }));
    const t0 = performance.now();
    (function frame(now) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const p of parts) {
        p.vy += 0.38; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.globalAlpha = Math.max(0, 1 - (now - t0) / 3200);
        ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
      }
      if (now - t0 < 3200) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
    })(t0);
  }

  // ---------- Controls ----------
  function syncUrl() {
    const p = new URLSearchParams();
    if (state.date && state.date !== state.today) p.set('date', state.date);
    if (state.metric !== 'revenue') p.set('metric', state.metric);
    if (document.body.classList.contains('tv')) p.set('tv', '1');
    history.replaceState(null, '', p.toString() ? '?' + p : location.pathname);
  }
  function go(date) { state.date = date; syncUrl(); load(); }

  $('prev').onclick = () => state.date && go(shift(state.date, -1));
  $('next').onclick = () => state.date && state.date < state.today && go(shift(state.date, 1));
  $('todayBtn').onclick = () => go(state.today);
  $('datePicker').onchange = e => e.target.value && go(e.target.value);
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { state.metric = b.dataset.metric; syncUrl(); if (state.data) render(); });

  function toggleTv(force) {
    const on = force ?? !document.body.classList.contains('tv');
    document.body.classList.toggle('tv', on);
    try {
      if (on && !document.fullscreenElement && force === undefined) document.documentElement.requestFullscreen?.();
      if (!on && document.fullscreenElement) document.exitFullscreen?.();
    } catch {}
    syncUrl();
    setTimeout(() => document.querySelectorAll('#bars .row').forEach(placeRow), 300);
  }
  $('tvBtn').onclick = () => toggleTv();
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('tv')) toggleTv(false); });
  if (qs.get('tv') === '1') document.body.classList.add('tv');

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') $('prev').click();
    if (e.key === 'ArrowRight') $('next').click();
    if (e.key === 'f' || e.key === 'F') toggleTv();
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load({ quiet: true }); });

  // Clock
  function tick() {
    $('clock').textContent = new Date().toLocaleString('en-US', { weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  tick(); setInterval(tick, 15_000);

  // Tooltip
  const tip = $('tip');
  function showTip(row, x, y) {
    const a = $('bars')._agents && $('bars')._agents[row.dataset.i];
    if (!a) return;
    tip.innerHTML = `<h3>${esc(a.agent)}</h3>
      <div>Revenue <b>${money(a.revenue, true)}</b></div>
      <div>Premium <b>${money(a.premium, true)}</b></div>
      <div>Policies <b>${a.apps}</b></div>`;
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.min(x + 16, innerWidth - r.width - 8) + 'px';
    tip.style.top = Math.min(y + 16, innerHeight - r.height - 8) + 'px';
    tip.classList.add('show');
  }
  $('bars').addEventListener('mousemove', e => { const row = e.target.closest('.row'); row ? showTip(row, e.clientX, e.clientY) : tip.classList.remove('show'); });
  $('bars').addEventListener('mouseleave', () => tip.classList.remove('show'));
  $('bars').addEventListener('focusin', e => { const row = e.target.closest('.row'); if (row) { const r = row.getBoundingClientRect(); showTip(row, r.left + 200, r.bottom - 8); } });
  $('bars').addEventListener('focusout', () => tip.classList.remove('show'));

  load();
  connectStream();
})();
</script>
</body>
</html>
